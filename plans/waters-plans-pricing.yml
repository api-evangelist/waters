description: Waters Corporation is an analytical-instrument and laboratory-informatics vendor (Empower
  CDS, NuGenesis SDMS, waters_connect). Public API or developer-self-service plans are not published.
  Programmatic access is delivered through the on-premise / private-cloud informatics platforms under
  enterprise license, and is negotiated via Waters sales and professional services. No public per-call
  prices, free tier, or self-serve sign-up are advertised.
notes: No public pricing page or developer plans were located on waters.com. Access is via enterprise
  software license + professional services engagement. Scaffold reduced to a single Contact Sales plan.

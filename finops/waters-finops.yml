description: FinOps placement for Waters Corporation laboratory-informatics and analytical-instrument
  software. Spend is governed by enterprise license + professional services contracts rather than
  metered API usage; FOCUS mapping is limited until a billable API surface is published.
notes: No public usage-billing API or invoice schema published. Meters and FOCUS columns reflect the
  enterprise-license shape only.

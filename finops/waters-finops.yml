meters:
  - name: enterprise_license
    description: Negotiated enterprise license for Waters informatics software; not metered per call.
    unit: varies
    aggregation: sum
principles:
  - name: Visibility
    description: Spend visibility comes from procurement and contract records held with Waters; there
      is no public usage telemetry API to query.
  - name: Allocation
    description: Allocate Waters spend to the lab(s), instrument fleet, and study programs using internal
      cost-center tagging on the purchase order and software license.
  - name: Optimization
    description: Optimization levers are negotiated at renewal — license counts, module bundles, and
      professional-services scope — rather than at per-call granularity.
  - name: Accountability
    description: Lab IT, scientific computing, or QC operations typically own Waters software spend and
      coordinate renewals with Waters account management.

description: Waters Corporation does not publish a public developer API or rate-limit documentation.
  Programmatic interfaces ship inside the Empower CDS / waters_connect informatics platforms and run
  on customer-controlled infrastructure (on-prem or private cloud); throughput limits are governed by
  the deployed environment and the enterprise contract, not by a public quota policy.
notes: No public rate-limit documentation found on waters.com. Limits are environment- and contract-specific.
